name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Run wf-verify
        run: |
          chmod +x bin/wf-verify
          ./bin/wf-verify .
