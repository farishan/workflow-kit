# NOTE: CI runs only on PR + push to main to avoid noisy runs.
# Email-on-failure: GitHub notifies watchers by default; disable in GitHub Settings -> Notifications -> Actions,
# or repo Settings -> Notifications. Non-blocking steps use continue-on-error.
name: verify
on:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Python + pytest
        run: python3 -m pip install --quiet pytest
      - name: Run wf-verify
        run: |
          chmod +x bin/wf-verify
          ./bin/wf-verify .